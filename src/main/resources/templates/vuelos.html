<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vuelos')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('vuelo')}"></nav>

<main class="container py-4">

    <!-- ===================== ENCABEZADO ===================== -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-4 bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                 style="width:56px;height:56px;">
                <i class="bi bi-calendar-check fs-3"></i>
            </div>
            <div>
                <h1 class="h3 mb-0 fw-bold">Vuelos</h1>
                <p class="text-muted mb-0 small">Instancias con fecha de los programas de vuelo.</p>
            </div>
        </div>
        <div class="d-flex gap-2">
            <span class="badge rounded-pill text-bg-light border px-3 py-2">
                <i class="bi bi-database me-1"></i>
                <span th:text="${vuelos != null ? #lists.size(vuelos) : 0}">0</span> registros
            </span>
            <button class="btn btn-primary rounded-pill px-3"
                    data-bs-toggle="collapse" data-bs-target="#panelFormulario">
                <i class="bi bi-plus-lg me-1"></i> Nuevo
            </button>
        </div>
    </div>

    <!-- ===================== TOASTS ===================== -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080;">
        <div th:if="${ok}" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${ok}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>
        </div>
        <div th:if="${error}" class="toast align-items-center text-bg-danger border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <!-- ===================== FORMULARIO ===================== -->
        <div class="col-12">
            <div class="collapse show" id="panelFormulario">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0 fw-semibold">
                                <i class="bi bi-pencil-square me-1 text-primary"></i>
                                <span th:text="${vuelo != null and vuelo.id != null
                                                 ? 'Editar vuelo' : 'Nuevo vuelo'}">
                                    Nuevo vuelo
                                </span>
                            </h2>
                            <button type="button" class="btn-close"
                                    data-bs-toggle="collapse" data-bs-target="#panelFormulario"></button>
                        </div>

                        <form th:action="@{/vuelo/guardar}"
                              th:object="${vuelo}"
                              method="post"
                              novalidate
                              class="row g-3">

                            <input type="hidden" th:field="*{id}"/>

                            <!-- Codigo del vuelo -->
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small text-uppercase text-muted">
                                    Codigo
                                </label>
                                <input type="text"
                                       th:field="*{codigoVuelo}"
                                       class="form-control form-control-lg text-uppercase font-monospace"
                                       maxlength="15"
                                       placeholder="AV100-2026-01-15"
                                       required/>
                                <div th:if="${#fields.hasErrors('codigoVuelo')}"
                                     th:errors="*{codigoVuelo}"
                                     class="text-danger small mt-1"></div>
                            </div>

                            <!-- Fecha del vuelo -->
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small text-uppercase text-muted">
                                    Fecha
                                </label>
                                <input type="date"
                                       th:field="*{fechaVuelo}"
                                       class="form-control form-control-lg"
                                       required/>
                                <div th:if="${#fields.hasErrors('fechaVuelo')}"
                                     th:errors="*{fechaVuelo}"
                                     class="text-danger small mt-1"></div>
                            </div>

                            <!-- Plazas vacias -->
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small text-uppercase text-muted">
                                    Plazas vacias
                                </label>
                                <input type="number"
                                       th:field="*{plazasVacias}"
                                       class="form-control form-control-lg"
                                       min="0"
                                       step="1"
                                       placeholder="12"
                                       required/>
                                <div th:if="${#fields.hasErrors('plazasVacias')}"
                                     th:errors="*{plazasVacias}"
                                     class="text-danger small mt-1"></div>
                            </div>

                            <!-- Select Avion -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-uppercase text-muted">
                                    Avion
                                </label>
                                <select th:field="*{avion}" class="form-select" required>
                                    <option value="">-- Seleccione un avion --</option>
                                    <option th:each="av : ${aviones}"
                                            th:value="${av.id}"
                                            th:text="${av.numeroSerie + ' (' + av.nombre + ')'}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('avion')}"
                                     th:errors="*{avion}"
                                     class="text-danger small mt-1"></div>
                            </div>

                            <!-- Select ProgramaVuelo -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-uppercase text-muted">
                                    Programa de vuelo
                                </label>
                                <select th:field="*{programaVuelo}" class="form-select" required>
                                    <option value="">-- Seleccione un programa --</option>
                                    <option th:each="p : ${programas}"
                                            th:value="${p.id}"
                                            th:text="${p.codigoPro + ' - ' + p.numeVuelo}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('programaVuelo')}"
                                     th:errors="*{programaVuelo}"
                                     class="text-danger small mt-1"></div>
                            </div>

                            <!-- Activo -->
                            <div class="col-md-4 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input type="checkbox"
                                           th:field="*{activo}"
                                           class="form-check-input"
                                           role="switch"/>
                                    <label class="form-check-label">Activo</label>
                                </div>
                            </div>

                            <div class="col-12 d-flex justify-content-end gap-2 pt-2 border-top">
                                <a th:href="@{/vuelo}" class="btn btn-light rounded-pill px-4">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4">
                                    <i class="bi bi-save me-1"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================== TABLA ===================== -->
        <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <h2 class="h6 mb-0 fw-semibold">
                        <i class="bi bi-list-ul me-1 text-primary"></i>Listado
                    </h2>
                    <div class="input-group input-group-sm" style="max-width:280px;">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text"
                               id="buscarVuelo"
                               class="form-control border-start-0 bg-light"
                               placeholder="Buscar vuelo..."/>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tablaVuelos">
                        <thead class="table-light">
                        <tr class="small text-uppercase text-muted">
                            <th style="width:60px">#</th>
                            <th>Codigo</th>
                            <th>Fecha</th>
                            <th class="text-end">Plazas</th>
                            <th>Avion</th>
                            <th>Programa</th>
                            <th style="width:110px">Estado</th>
                            <th style="width:120px" class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${vuelos}">
                            <td class="text-muted small" th:text="${v.id}"></td>
                            <td>
                                <span class="badge rounded-pill text-bg-primary font-monospace px-3 py-2"
                                      th:text="${v.codigoVuelo}">AV100</span>
                            </td>
                            <td class="font-monospace" th:text="${v.fechaVuelo}">2026-01-15</td>
                            <td class="text-end fw-semibold" th:text="${v.plazasVacias}">0</td>
                            <td>
                                <span th:if="${v.avion != null}"
                                      class="badge text-bg-light border"
                                      th:text="${v.avion.numeroSerie}">N12345</span>
                                <span th:if="${v.avion == null}"
                                      class="badge text-bg-secondary">Sin avion</span>
                            </td>
                            <td>
                                <span th:if="${v.programaVuelo != null}"
                                      class="badge text-bg-light border"
                                      th:text="${v.programaVuelo.codigoPro}">PRO-001</span>
                                <span th:if="${v.programaVuelo == null}"
                                      class="badge text-bg-secondary">Sin programa</span>
                            </td>
                            <td>
                                <span th:if="${v.activo}"
                                      class="badge rounded-pill text-bg-success-subtle text-success-emphasis border border-success-subtle">
                                    <i class="bi bi-check-circle me-1"></i>Activo
                                </span>
                                <span th:unless="${v.activo}"
                                      class="badge rounded-pill text-bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">
                                    <i class="bi bi-slash-circle me-1"></i>Inactivo
                                </span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/vuelo/{id}/editar(id=${v.id})}"
                                   class="btn btn-sm btn-light rounded-circle"
                                   title="Editar">
                                    <i class="bi bi-pencil text-primary"></i>
                                </a>
                                <form th:action="@{/vuelo/{id}/eliminar(id=${v.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit"
                                            class="btn btn-sm btn-light rounded-circle"
                                            title="Eliminar"
                                            onclick="return confirm('Eliminar el vuelo?')">
                                        <i class="bi bi-trash text-danger"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${vuelos == null or #lists.isEmpty(vuelos)}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <i class="bi bi-inbox display-5 d-block mb-2 text-secondary"></i>
                                <div class="fw-semibold">No hay vuelos registrados</div>
                                <div class="small">Usa el boton "Nuevo" para agregar el primero.</div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toast').forEach(t => {
            new bootstrap.Toast(t, { delay: 4000 }).show();
        });

        const input = document.getElementById('buscarVuelo');
        if (!input) return;
        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            document.querySelectorAll('#tablaVuelos tbody tr').forEach(tr => {
                if (tr.cells.length < 8) return;
                tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    });
</script>
</body>
</html>
